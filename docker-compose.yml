services:
  analytics-service:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8006}:${ANALYTICS_PORT:-8006}"
    environment:
      ANALYTICS_ENVIRONMENT: ${ANALYTICS_ENVIRONMENT:-local}
      ANALYTICS_PUBLIC_BASE_PATH: ${ANALYTICS_PUBLIC_BASE_PATH:-/api/v1}
      ANALYTICS_PORT: ${ANALYTICS_PORT:-8006}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['ANALYTICS_PORT'] + '/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      centinela-net:
        aliases:
          - analytics-service

networks:
  centinela-net:
    external: true
